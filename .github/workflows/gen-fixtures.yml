name: Generate fixtures

on: workflow_dispatch

jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init lsts submodule
        run: git submodule update --init tests/lsts
      - name: Sparse-checkout linux
        run: |
          git submodule init tests/linux
          git -C tests/linux init
          git -C tests/linux remote add origin git://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
          git -C tests/linux config core.sparseCheckout true
          mkdir -p tests/linux/.git/info
          cat > tests/linux/.git/info/sparse-checkout << 'SPEOF'
          arch/arm/kernel/unwind.c
          arch/arm/lib/xor-neon.c
          arch/arm/mach-exynos/platsmp.c
          arch/parisc/kernel/
          arch/powerpc/kvm/book3s_paired_singles.c
          crypto/shash.c
          drivers/gpio/gpio-amd8111.c
          include/
          kernel/debug/kdb/kdb_io.c
          kernel/irq/
          kernel/pid_namespace.c
          kernel/sched/core.c
          kernel/sched/rt.c
          kernel/time/sleep_timeout.c
          kernel/umh.c
          SPEOF
          git -C tests/linux fetch --depth 1 origin 46b513250491a7bfc97d98791dbe6a10bcc8129d
          git -C tests/linux checkout FETCH_HEAD
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build cscope database
        run: nix develop --command bash -c 'cd tests/linux && cscope -bRq'
      - name: Add snapshot tests
        run: |
          FIXTURES="$(pwd)/tests/fixtures"
          cat >> tests/anakins-c-ls_tests.bats << BATSEOF

          @test "SNAPSHOT call_hierarchy_prepare try_one_irq" { lsts_call_hierarchy_prepare "linux/kernel/irq/spurious.c:28:13" > "$FIXTURES/call_hierarchy_prepare_try_one_irq.rpc.json"; }
          @test "SNAPSHOT goto_incoming_calls try_one_irq" { lsts_goto_incoming_calls "linux/kernel/irq/spurious.c:28:13" > "$FIXTURES/incoming_calls_try_one_irq.rpc.json"; }
          @test "SNAPSHOT goto_outgoing_calls misrouted_irq" { lsts_goto_outgoing_calls "linux/kernel/irq/spurious.c:80:12" > "$FIXTURES/outgoing_calls_misrouted_irq.rpc.json"; }
          @test "SNAPSHOT document_symbols spurious" { lsts_document_symbols "linux/kernel/irq/spurious.c" > "$FIXTURES/document_symbols_spurious.rpc.json"; }
          @test "SNAPSHOT references try_one_irq" { lsts_references "linux/kernel/irq/spurious.c:28:13" > "$FIXTURES/references_try_one_irq.rpc.json"; }
          @test "SNAPSHOT rename try_one_irq" { lsts_rename "linux/kernel/irq/spurious.c:28:13" "try_one_interrupt" > "$FIXTURES/rename_try_one_irq.rpc.json"; }
          @test "SNAPSHOT formatting spurious" { lsts_formatting "linux/kernel/irq/spurious.c" > "$FIXTURES/formatting_spurious.rpc.json"; }
          @test "SNAPSHOT completion try" { lsts_completion "linux/kernel/irq/spurious.c:28:4" > "$FIXTURES/completion_try.rpc.json"; }
          BATSEOF
      - name: Run snapshot tests
        run: nix develop --command make filter FILTER="SNAPSHOT" || true
      - name: Restore bats file
        run: git checkout tests/anakins-c-ls_tests.bats
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/
          git diff --cached --quiet || git commit -m "chore: generate test fixtures"
          git push
