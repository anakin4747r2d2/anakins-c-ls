name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init lsts submodule
        run: git submodule update --init tests/lsts

      - name: Sparse-checkout linux kernel files needed for tests
        run: |
          git submodule init tests/linux
          git -C tests/linux init
          git -C tests/linux remote add origin git://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
          git -C tests/linux config core.sparseCheckout true
          mkdir -p tests/linux/.git/info
          bash scripts/list-sparse-paths > tests/linux/.git/info/sparse-checkout
          LINUX_REV=46b513250491a7bfc97d98791dbe6a10bcc8129d
          git -C tests/linux fetch --depth 1 origin $LINUX_REV
          git -C tests/linux checkout FETCH_HEAD

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build cscope database for tests
        run: nix develop --command bash -c 'cd tests/linux && cscope -bRq'

      - name: Build and test
        run: make all
