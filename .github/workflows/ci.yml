name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init lsts submodule
        run: git submodule update --init tests/lsts

      - name: Sparse-checkout linux kernel files needed for tests
        run: |
          git submodule init tests/linux
          git -C tests/linux init
          git -C tests/linux remote add origin git://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
          git -C tests/linux config core.sparseCheckout true
          mkdir -p tests/linux/.git/info
          cat > tests/linux/.git/info/sparse-checkout << 'EOF'
          arch/arm/kernel/unwind.c
          arch/arm/lib/xor-neon.c
          arch/arm/mach-exynos/platsmp.c
          arch/parisc/kernel/asm-offsets.c
          arch/parisc/kernel/parisc_ksyms.c
          arch/parisc/kernel/ptrace.c
          arch/parisc/kernel/smp.c
          arch/parisc/kernel/traps.c
          arch/powerpc/kvm/book3s_paired_singles.c
          crypto/shash.c
          drivers/gpio/gpio-amd8111.c
          include/linux/irq.h
          include/linux/irqdesc.h
          kernel/debug/kdb/kdb_io.c
          kernel/irq/
          kernel/sched/core.c
          kernel/sched/rt.c
          kernel/time/sleep_timeout.c
          kernel/umh.c
          EOF
          LINUX_REV=46b513250491a7bfc97d98791dbe6a10bcc8129d
          git -C tests/linux fetch --depth 1 origin $LINUX_REV
          git -C tests/linux checkout FETCH_HEAD

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build and test
        run: make all
